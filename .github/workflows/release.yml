name: Release cross-platform app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches application version
        run: |
          version="$(dotnet msbuild src/App/CodexTpsFloat.App.csproj -nologo -getProperty:Version)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Run core regression tests
        run: dotnet run --project tests/CoreTests.csproj -c Release --nologo

      - name: Run Avalonia regression tests
        run: dotnet run --project tests/AppTests.csproj -c Release --nologo

  release:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
            shell: pwsh
          - runner: macos-15
            runtime: osx-arm64
            shell: bash
          - runner: macos-15-intel
            runtime: osx-x64
            shell: bash
          - runner: ubuntu-latest
            runtime: linux-x64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run core regression tests
        run: dotnet run --project tests/CoreTests.csproj -c Release --nologo

      - name: Run legacy WPF hidden tray lifecycle tests (Windows only)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/TrayLifecycleTests.csproj -c Release --nologo -- --never-show

      - name: Run Avalonia regression tests on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet run --project tests/AppTests.csproj -c Release --nologo

      - name: Build portable application
        if: runner.os == 'Windows'
        run: ./build.ps1 -Runtime ${{ matrix.runtime }} -Portable

      - name: Build portable application
        if: runner.os != 'Windows'
        run: PORTABLE=1 ./build.sh ${{ matrix.runtime }}

      - name: Package portable archive and checksum
        id: package
        if: runner.os == 'Windows'
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $stagingDirectory = Join-Path $env:RUNNER_TEMP 'portable-package'
          New-Item -ItemType Directory -Path $assetDirectory, $stagingDirectory | Out-Null
          Copy-Item -LiteralPath 'app/CodexTpsFloat.exe', 'README.md', 'PRIVACY.md', 'THIRD-PARTY-NOTICES.md' -Destination $stagingDirectory
          Copy-Item -LiteralPath 'licenses' -Destination $stagingDirectory -Recurse
          $archiveName = "CodexTpsFloat-$env:GITHUB_REF_NAME-${{ matrix.runtime }}-portable.zip"
          $archivePath = Join-Path $assetDirectory $archiveName
          Compress-Archive -Path "$stagingDirectory/*" -DestinationPath $archivePath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii
          "directory=$assetDirectory" >> $env:GITHUB_OUTPUT
          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Package portable archive and checksum
        id: package_unix
        if: runner.os != 'Windows'
        run: |
          asset_directory="$RUNNER_TEMP/release-assets"
          staging_directory="$RUNNER_TEMP/portable-package"
          mkdir -p "$asset_directory" "$staging_directory"
          cp app/CodexTpsFloat README.md PRIVACY.md THIRD-PARTY-NOTICES.md "$staging_directory/"
          cp -R licenses "$staging_directory/"
          archive_name="CodexTpsFloat-$GITHUB_REF_NAME-${{ matrix.runtime }}-portable.tar.gz"
          archive_path="$asset_directory/$archive_name"
          tar -czf "$archive_path" -C "$staging_directory" .
          (cd "$asset_directory" && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          echo "directory=$asset_directory" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Smoke test extracted portable application
        if: runner.os == 'Windows'
        env:
          PORTABLE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          Expand-Archive -LiteralPath $env:PORTABLE_ARCHIVE -DestinationPath $smokeDirectory
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'fixture-codex-home'
          $sessionDirectory = Join-Path $fixtureDirectory 'sessions'
          New-Item -ItemType Directory -Path $sessionDirectory | Out-Null
          @(
            '{"type":"event_msg","timestamp":"2026-10-14T00:00:00Z","payload":{"type":"task_started","turn_id":"smoke-turn"}}'
            '{"type":"event_msg","timestamp":"2026-10-14T00:00:01Z","payload":{"type":"token_count","info":null}}'
            '{"type":"event_msg","timestamp":"2026-10-14T00:00:02Z","payload":{"type":"turn_aborted","turn_id":"smoke-turn"}}'
          ) | Set-Content -LiteralPath (Join-Path $sessionDirectory 'aborted.jsonl') -Encoding utf8
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'portable-snapshot.json'
          $arguments = @('--codex-home', ('"' + $fixtureDirectory + '"'), '--snapshot-json', ('"' + $snapshotPath + '"'))
          $process = Start-Process -FilePath (Join-Path $smokeDirectory 'CodexTpsFloat.exe') -ArgumentList $arguments -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Portable snapshot timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Portable snapshot failed: $($process.ExitCode)" }
          $snapshot = Get-Content -LiteralPath $snapshotPath -Raw | ConvertFrom-Json
          if ($snapshot.Files -ne 1 -or $snapshot.InvalidLines -ne 0 -or $snapshot.UnsupportedFiles -ne 0 -or $snapshot.ReadFailures -ne 0) {
            throw 'Portable snapshot incorrectly reports an aborted session as unsupported.'
          }

      - name: Smoke test extracted portable application
        if: runner.os != 'Windows'
        env:
          PORTABLE_ARCHIVE: ${{ steps.package_unix.outputs.archive }}
        run: |
          smoke_directory="$RUNNER_TEMP/portable-smoke"
          fixture_directory="$RUNNER_TEMP/fixture-codex-home"
          session_directory="$fixture_directory/sessions"
          mkdir -p "$smoke_directory" "$session_directory"
          tar -xzf "$PORTABLE_ARCHIVE" -C "$smoke_directory"
          cat > "$session_directory/aborted.jsonl" <<'EOF'
          {"type":"event_msg","timestamp":"2026-10-14T00:00:00Z","payload":{"type":"task_started","turn_id":"smoke-turn"}}
          {"type":"event_msg","timestamp":"2026-10-14T00:00:01Z","payload":{"type":"token_count","info":null}}
          {"type":"event_msg","timestamp":"2026-10-14T00:00:02Z","payload":{"type":"turn_aborted","turn_id":"smoke-turn"}}
          EOF
          snapshot_path="$RUNNER_TEMP/portable-snapshot.json"
          "$smoke_directory/CodexTpsFloat" --codex-home "$fixture_directory" --snapshot-json "$snapshot_path"
          python3 - "$snapshot_path" <<'PY'
          import json, sys
          snapshot = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          if (snapshot["Files"], snapshot["InvalidLines"], snapshot["UnsupportedFiles"], snapshot["ReadFailures"]) != (1, 0, 0, 0):
              raise SystemExit("Portable snapshot incorrectly reports an aborted session as unsupported.")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexTpsFloat-${{ github.ref_name }}-${{ matrix.runtime }}
          path: ${{ runner.os == 'Windows' && steps.package.outputs.directory || steps.package_unix.outputs.directory }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out annotated tag for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Codex TPS $GITHUB_REF_NAME" --notes-from-tag --latest
